<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    DocumentRoot /var/www/cs4239-lab/public
    <Directory /var/www/cs4239-lab/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/cs4239-lab-error.log
    CustomLog ${APACHE_LOG_DIR}/cs4239-lab-access.log combined
</VirtualHost>
